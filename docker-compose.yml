services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: navroot
      MYSQL_DATABASE: navhub
      MYSQL_USER: nav
      MYSQL_PASSWORD: navpass
    ports:
      - "3306:3306"
    volumes:
      - nav-mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: mysql+pymysql://nav:navpass@mysql:3306/navhub?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-now
      PROXY_POOL_URL: ""
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  nav-mysql:
